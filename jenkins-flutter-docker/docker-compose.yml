version: '3.8'

services:
  jenkins-front:
    build: .
    container_name: jenkins-front
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50001:50000"
    volumes:
      - jenkins_front_data:/var/jenkins_home
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true

volumes:
  jenkins_front_data: